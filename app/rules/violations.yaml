# База знаний: тип нарушения -> что видно на видео -> норматив.
#
# Критерий 4 (15 баллов): «отсутствие выдуманных ссылок». Пункты ниже прочитаны на adilet.zan.kz
# (текст постановлений — docs/norms.md). Если связь пункта с видимым на видео косвенная — так и написано в clause.
# Нельзя утверждать то, что не видно на видео (документы, проводки, сверки) — FAQ.
#   clip_prompts — английские фразы для zero-shot классификации (fallback, пока нет обученной модели типов).

documents:
  security_rules:
    title: "Правила организации охраны и устройства помещений банков второго уровня, ... (постановление Правления НБРК от 24.02.2020 № 14, зарегистрировано в МЮ РК 27.02.2020 № 20075)"
    url: "https://adilet.zan.kz/rus/docs/V2000020075"
    verified: true     # пункты 6, 8, 12, 13, 16, 21 прочитаны на adilet.zan.kz; см. docs/norms.md
  cash_rules:
    title: "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня, ... (постановление Правления НБРК от 29.11.2019 № 231, зарегистрировано в МЮ РК 03.12.2019 № 19680)"
    url: "https://adilet.zan.kz/rus/docs/V1900019680"
    verified: true     # пункты 2, 12, 20, 22, 74, 75, 80 прочитаны на adilet.zan.kz 17.10.2026 (редакция с изм. от 30.06.2026 № 78); см. docs/norms.md

violations:
  unauthorized_person:
    title: "Посторонний в кассовом помещении"
    observed: "в кассовой зоне находится лицо, не являющееся кассиром, рядом с рабочим местом/ценностями"
    why: "доступ в кассовый узел и к местам хранения наличных денег ограничен"
    document: security_rules
    clause: "пункты 8 и 16 (подп. 1): кассовый узел изолирован одним закрывающимся служебным входом, касса имеет отдельный вход с дверью на замке; см. также постановление НБРК № 231, п. 75 — вход в кладовую/сейфовую комнату только лицам, ответственным за сохранность наличных денег (связь с видимым на видео косвенная)"
    clip_prompts:
      - "a stranger standing next to the cashier desk in a cash room"
      - "two people behind the cashier desk"

  cashier_left_workplace:
    title: "Кассир оставил рабочее место с ценностями без присмотра"
    observed: "кассир отходит от рабочего места или покидает помещение, наличные/ценности/разблокированный ноутбук остаются без присмотра"
    why: "кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента; ранее принятые наличные хранятся в устройствах, закрывающихся на ключ"
    document: cash_rules
    clause: "п. 22 (не допускается покидать рабочее место до окончания обслуживания клиента), п. 20 ч. 2 (ранее принятые наличные хранятся в закрывающихся на ключ устройствах на рабочем месте); электронные носители с банковской защищаемой информацией относятся к ценностям — п. 2 подп. 17 (применимость к ноутбуку — косвенная)"
    clip_prompts:
      - "an empty cashier desk with money left on it"
      - "the cashier walks away from the desk leaving cash unattended"
      - "an empty office desk with an unlocked laptop showing a spreadsheet"

  safe_left_open:
    title: "Сейф оставлен открытым"
    observed: "дверца сейфа/металлического шкафа открыта, кассир не находится рядом"
    why: "наличные деньги хранятся в закрывающихся на ключ устройствах (сейф, металлический шкаф); порядок хранения ключей должен исключать несанкционированное использование"
    document: cash_rules
    clause: "п. 20 ч. 2 (хранение в специальных устройствах, закрывающихся на ключ: металлический шкаф, сейф, тележка, ящики стола), п. 80 (хранение ключей от этих устройств исключает их несанкционированное использование)"
    clip_prompts:
      - "an open metal safe in an office with nobody near it"

  personal_items:
    title: "Личные вещи / еда на рабочем месте кассира"
    observed: "на рабочем месте кассира лежат личные вещи (сумка, телефон, еда, напитки)"
    why: "личные вещи, наличные деньги и ценности работников банка хранятся вне кассового узла"
    document: cash_rules
    clause: "п. 12 (хранение личных вещей, наличных денег и ценностей работников банка осуществляется вне кассового узла)"
    clip_prompts:
      - "a handbag and a phone lying on the cashier desk"
      - "food and a drink on the cashier desk next to money"

  improper_handover:
    title: "Нарушение порядка передачи ценностей (инкассация)"
    observed: "сумка/пакет с ценностями передаётся вне кассовой зоны или на виду у третьих лиц"
    why: "при инкассации обеспечивается ограничение доступа и просмотра третьими лицами"
    document: security_rules
    clause: "п. 21 (при инкассации обеспечивается ограничение доступа и просмотра третьими лицами); документальный порядок приёма от инкассаторов — постановление НБРК № 231, пп. 24, 105–107 (по видео не проверяется)"
    clip_prompts:
      - "a cashier handing a bag to a man in a suit across the desk"
      - "a cash collection bag being passed through a doorway"

  door_open:
    title: "Дверь кассового помещения открыта во время работы с ценностями"
    observed: "дверь кассового помещения открыта, в это время ведётся работа с наличными"
    why: "касса изолируется закрывающимся на замок входом"
    document: security_rules
    clause: "пункты 8 и 16 (подп. 1): изоляция кассового узла закрывающимся служебным входом, отдельный вход в кассу с дверью на замке (требование к устройству; связь с открытой дверью косвенная)"
    clip_prompts:
      - "an open glass door of a cash room while the cashier counts money"

  # Универсальный тип — для нарушений, которых не было в обучении (FAQ п.9).
  generic:
    title: "Признаки возможного нарушения кассовой дисциплины"
    observed: "зафиксировано нетипичное действие в кассовой зоне"
    why: "действие отличается от штатного порядка работы кассира и требует проверки человеком"
    document: cash_rules
    clause: null
    clip_prompts: []
